name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Regenerate repository status doc
        run: python3 scripts/sync_project_docs.py

      - name: Fail if generated docs are stale
        run: git diff --exit-code -- docs/repository-status.md

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
